version: 2
updates:
  # The extension ships zero runtime dependencies, so these are all build/test
  # tooling. One grouped PR a week keeps the noise down.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
